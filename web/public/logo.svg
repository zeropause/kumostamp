<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 0 64 64" role="img" aria-label="Kumostamp">
  <!-- Kumostamp mark: the K's arm and leg are two clock hands swinging from the stem,
       inside a half dial. The leg is the red pencil: where you stopped. -->
